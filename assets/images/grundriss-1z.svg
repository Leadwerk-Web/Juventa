<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title1 desc1">
  <title id="title1">Grundriss Einzimmer-Apartment</title>
  <desc id="desc1">Schematischer Grundriss: Wohn-Schlafbereich, Küche und Bad</desc>
  <rect width="640" height="480" fill="#F7F2EC"/>
  <g fill="none" stroke="#2F5B5C" stroke-width="4" stroke-linejoin="round">
    <rect x="40" y="40" width="560" height="400" rx="4"/>
    <path d="M40 280h360"/>
    <path d="M400 40v400"/>
    <path d="M400 220h200"/>
  </g>
  <g fill="#2F5B5C" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
    <text x="220" y="170">Wohnen / Schlafen</text>
    <text x="220" y="360">Küche</text>
    <text x="500" y="140">Bad</text>
    <text x="500" y="340">Diele</text>
  </g>
  <g stroke="#BE8871" stroke-width="3" fill="none">
    <path d="M400 300v40"/>
    <path d="M180 280v-30"/>
  </g>
  <text x="320" y="460" fill="#8B8076" font-family="DM Sans, Arial, sans-serif" font-size="13" text-anchor="middle">Typ A · Einzimmer · Schema zur Orientierung</text>
</svg>
